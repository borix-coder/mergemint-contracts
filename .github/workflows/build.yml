name: WASM Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry and wasm build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/wasm32v1-none
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-

      - name: Build WASM
        run: cargo build --release --target wasm32v1-none

      - name: Report WASM binary size
        run: |
          WASM_FILE=$(find target/wasm32v1-none/release -name "*.wasm" | head -1)
          if [ -n "$WASM_FILE" ]; then
            SIZE=$(wc -c < "$WASM_FILE")
            echo "### WASM Binary Size" >> $GITHUB_STEP_SUMMARY
            echo "**File:** \`$WASM_FILE\`" >> $GITHUB_STEP_SUMMARY
            echo "**Size:** ${SIZE} bytes ($(echo "scale=2; $SIZE/1024" | bc) KB)" >> $GITHUB_STEP_SUMMARY
          fi
